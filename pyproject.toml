[project]
name = "wowam"
version = "0.1.2"
description = "World of Warcraft addon manager for Linux"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
wowam = "wowam.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wowam = ["gui/qml/Wowam/*", "gui/qml/Wowam/icons/*", "data/*"]
